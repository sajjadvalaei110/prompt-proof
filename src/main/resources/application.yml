server:
  port: 8085
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:sqlite:${codeatlas.data-dir:./data}/codeatlas.db
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    url: ${spring.datasource.url}

codeatlas:
  data-dir: ./data
  model:
    base-url: ""
    model-id: ""
    context-budget: 8192
    output-budget: 2048
    timeout-seconds: 120
    concurrency: 1

# Local overrides: create application-local.yml with your model config
# Example:
#   codeatlas:
#     model:
#       base-url: "http://127.0.0.1:1234/v1"
#       model-id: "your-model-id"
